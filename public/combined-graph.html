<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined Graph Visualization</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.21.1/cytoscape.min.js"></script>
    <style>
        #cy {
            width: 100%;
            height: 900px;
            display: block;
        }
    </style>
</head>
<body>
    <h1>Combined Graph Visualization</h1>
    <input type="text" id="nodeInput" placeholder="Enter 5 nodes (comma-separated)">
    <button onclick="visualizeGraph()">Visualize Graph</button>
    <div id="cy"></div>

    <script>
        function visualizeGraph() {
            const nodes = document.getElementById('nodeInput').value.split(',').map(n => n.trim());
            if (nodes.length !== 5) {
                alert('Please enter exactly 5 nodes.');
                return;
            }

            fetch('/combined-graph', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({nodes: nodes}),
            })
            .then(response => response.json())
            .then(data => {
                const cy = cytoscape({
                    container: document.getElementById('cy'),
                    elements: data,
                    style: [
                        {
                            selector: 'node',
                            style: {
                                'background-color': '#666',
                                'label': 'data(label)'
                            }
                        },
                        {
                            selector: 'node.center-node',
                            style: {
                                'background-color': '#d97706',
                                'width': 30,
                                'height': 30
                            }
                        },
                        {
                            selector: 'edge',
                            style: {
                                'width': 'data(weight)',
                                'line-color': '#ccc',
                                'target-arrow-color': '#ccc',
                                'target-arrow-shape': 'triangle',
                                'curve-style': 'bezier',
                                'label': 'data(weight)'
                            }
                        }
                    ],
                    layout: {
                        name: 'grid',
                        rows: undefined,
                        cols: undefined,
                        position: function(node) {
                            return { row: node.data('row'), col: node.data('col') };
                        },
                        fit: true,
                        padding: 30,
                        avoidOverlap: true,
                        avoidOverlapPadding: 10,
                        condense: false,
                        animate: true,
                        animationDuration: 500
                    }
                });

                cy.on('tap', 'node', function(evt){
                    var node = evt.target;
                    console.log('tapped ' + node.id());
                });

                cy.on('dragfree', 'node', function(evt){
                    var node = evt.target;
                    console.log('dragged ' + node.id() + ' to ' + node.position().x + ', ' + node.position().y);
                });
            });
        }
    </script>
</body>
</html>
